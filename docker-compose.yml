services:
  securevault:
    build: .
    container_name: securevault
    ports:
      - "5000:5000"
    volumes:
      - vault_uploads:/app/uploads
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  vault_uploads:
    driver: local
